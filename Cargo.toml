[package]
name = "theme-report"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Read-only Quattro theme health reports"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
